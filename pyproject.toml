[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mverify"
version = "0.12.1"
description = "Local-first RTL design intelligence, UVM scaffolding and evidence-grounded verification workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf>=4,<6", "python-docx>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
mverify = "mverify.desktop:main"

[tool.setuptools.packages.find]
include = ["mverify*", "mcore*"]

[tool.pytest.ini_options]
testpaths = ["tests", "Mcore/tests"]
python_files = ["test_*.py"]
addopts = "-ra"
